name: Atualizar eventos JOMIVO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter JOMIVO
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnosticar pesquisa Porto
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen

          url = "https://www.agenda-porto.pt/pesquisa/"
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})

          with urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")

          links = set(re.findall(
              r'href=["\']([^"\']*evento/[^"\']+)',
              html
          ))

          print("Links individuais encontrados:", len(links))
          from collections import Counter

          months = Counter(re.findall(
            r'\b(?:Jan|Fev|Mar|Abr|Mai|Jun|Jul|Ago|Set|Out|Nov|Dez)\b',
            re.sub(r'<[^>]+>', ' ', html),
            flags=re.I
          ))

          print("Referências a meses:", dict(months))
          from html.parser import HTMLParser

          class EventLinkInspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.count = 0

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  data = dict(attrs)
                  href = data.get("href", "")
                  if "evento/" in href and self.count < 3:
                      print("EVENTO LINK:", href)
                      print("EVENTO ATRIBUTOS:", data)
                      self.count += 1

          inspector = EventLinkInspector()
          inspector.feed(html)
          print("Moonspell encontrado:", "moonspell-nov26" in html)
          pos = html.find("moonspell-nov26")
          if pos >= 0:
             print("Contexto Moonspell:", html[max(0, pos-200):pos+200])
          PY

      - name: Atualizar agenda
        run: python scripts/update_events.py

      - name: Validar events.json
        run: python -m json.tool events.json > /dev/null

      - name: Guardar nova agenda no repositório
        run: |
          if git diff --quiet -- events.json; then
            echo "Agenda sem alterações."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Atualizar agenda JOMIVO"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar JOMIVO
        id: deployment
        uses: actions/deploy-pages@v4
