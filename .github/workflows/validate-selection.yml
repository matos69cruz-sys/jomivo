name: Validar seleção JOMIVO (PR)

on:
  pull_request:
    paths:
      - "scripts/update_events.py"
      - "scripts/preview_selection.py"
      - ".github/workflows/update-events.yml"
      - ".github/workflows/validate-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe Python
        run: python -m py_compile scripts/update_events.py scripts/preview_selection.py

      - name: Verificar pré-visualização sem modificar events.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          original = Path("events.json")
          before = hashlib.sha256(original.read_bytes()).hexdigest()
          sample = {
              "events": [
                  {"area": "Porto", "name": "Concerto", "quality_level": "PREMIUM"},
                  {"area": "Porto", "name": "Peça de teatro", "quality_level": "RECOMENDADO"},
                  {"area": "Porto", "name": "Exposição", "quality_level": "INTERESSANTE"},
                  {"area": "Porto", "name": "A confirmar", "quality_level": "POR AVALIAR"},
                  {"area": "Porto", "name": "Aula de yoga", "quality_level": "ROTINA"},
                  {"area": "Braga", "name": "Concerto", "quality_level": "PREMIUM"}
              ]
          }
          with tempfile.TemporaryDirectory() as folder:
              fixture = Path(folder) / "fixture.json"
              fixture.write_text(json.dumps(sample), encoding="utf-8")
              result = subprocess.run(
                  [sys.executable, "scripts/preview_selection.py", "--input", str(fixture)],
                  capture_output=True, text=True, check=True,
              )
          print(result.stdout)
          for expected in (
              "Total geral: 6 | Porto: 5",
              "Potencial seleção: 3",
              "Revisão humana: 1",
              "Potencial rotina: 1",
              "Sem classificação reconhecida: 0",
          ):
              assert expected in result.stdout, f"Falta: {expected}"
          assert before == hashlib.sha256(original.read_bytes()).hexdigest()
          print("OK: seleção de teste correta e events.json intacto")
          PY

      - name: Testar recolha real numa pasta isolada (sem publicar)
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/jomivo-validation
          cp events.json /tmp/jomivo-validation/events.json
          cd /tmp/jomivo-validation
          python "$GITHUB_WORKSPACE/scripts/update_events.py" > collection.log 2>&1 || {
            tail -n 100 collection.log
            exit 1
          }
          grep -E 'JOMIVO RESUMO SCORE:|TOTAL:|Fontes atualizadas:|JOMIVO FILTRO ANTIGO POR TIPO:|JOMIVO FILTRO ANTIGO POSSÍVEIS EXCLUSÕES RELEVANTES:|JOMIVO REVER EXCLUSÃO:|JOMIVO REVER EXPOSIÇÃO EXCLUÍDA:' collection.log || true
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          events = json.loads(Path("events.json").read_text(encoding="utf-8"))["events"]
          porto = [e for e in events if e.get("area") == "Porto"]
          levels = Counter(e.get("quality_level", "SEM CLASSIFICAÇÃO") for e in porto)
          print("Porto:", len(porto), "| Classificações:", dict(levels))
          assert len(events) >= 3, "Recolha insuficiente"
          assert all("quality_level" in e and "quality_score" in e for e in porto), "Falta classificação"
          PY
          python "$GITHUB_WORKSPACE/scripts/preview_selection.py" --input events.json
          echo "Agenda pública e ficheiro original não foram alterados."
