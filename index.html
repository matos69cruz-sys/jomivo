const fallbackEvents=[

];
let jomivoEvents=[...fallbackEvents],eventsLoaded=false,eventSource='fallback';
async function loadJomivoEvents(){
 try{
  const r=await fetch(EVENT_FEED_URL+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('feed');
  const data=await r.json();
  if(!Array.isArray(data.events)) throw new Error('format');
  jomivoEvents=data.events;eventSource='feed';
 }catch(e){jomivoEvents=[...fallbackEvents];eventSource='fallback'}
 eventsLoaded=true;if(section===5)renderEvents();
}

function renderEvents(){
 const cards=$('cards');cards.replaceChildren();
 const intro=document.createElement('div');intro.className='eventIntro';intro.innerHTML=language==='pt'?'<h3> O que está a acontecer?</h3><p>Concertos, festivais, exposições, feiras e outros eventos para aproveitar durante a tua estadia.</p>':'<h3> What’s happening?</h3><p>Concerts, festivals, exhibitions, fairs and other events to enjoy during your stay.</p>';cards.append(intro);
 const whenLabel=document.createElement('div');whenLabel.className='filterLabel';whenLabel.textContent=language==='pt'?'QUANDO':'WHEN';cards.append(whenLabel);
 const periods=document.createElement('div');periods.className='eventFilters';[['Hoje','Today'],['Semana','This week'],['Mês','This month']].forEach(x=>{const b=document.createElement('button');b.textContent=language==='pt'?x[0]:x[1];b.className=eventPeriod===x[0]?'active':'';b.onclick=()=>{eventPeriod=x[0];renderEvents()};periods.append(b)});cards.append(periods);
 const whereLabel=document.createElement('div');whereLabel.className='filterLabel';whereLabel.textContent=language==='pt'?'ONDE':'WHERE';cards.append(whereLabel);
 const areas=document.createElement('div');areas.className='eventFilters';['Todos','Porto','Braga','Aveiro'].forEach(a=>{const b=document.createElement('button');b.textContent=(language==='en'&&a==='Todos')?'All':a;b.className=eventArea===a?'active':'';b.onclick=()=>{eventArea=a;renderEvents()};areas.append(b)});cards.append(areas);
 const typeLabel=document.createElement('div');typeLabel.className='filterLabel';typeLabel.textContent=language==='pt'?'TIPO DE EVENTO':'EVENT TYPE';cards.append(typeLabel);
 const categories=document.createElement('div');
 categories.className='eventFilters categoryFilters';['Todos','Música','Festas & Cultura','Gastronomia','Desporto','Outros'].forEach(x=>{const b=document.createElement('button');b.className='tab'+(eventCategory===x?' active':'');b.textContent={'Todos':'Todos','Música':'🎵 Música','Festas & Cultura':'🎉 Festas & Cultura','Gastronomia':'🍷 Gastronomia','Desporto':'⚽ Desporto','Outros':'✨ Outros'}[x];b.onclick=()=>{eventCategory=x;renderEvents()};categories.append(b)});cards.append(categories);
 const today=new Date();
 const dayStart=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 const weekEnd=new Date(dayStart);weekEnd.setDate(weekEnd.getDate()+6);
 const monthEnd=new Date(today.getFullYear(),today.getMonth()+1,0);
 const parse=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd)};
 const list=jomivoEvents.filter(e=>{if(eventCategory!=='Todos'&&e.type!==eventCategory)return false;if(eventArea!=='Todos'&&e.area!==eventArea)return false;const a=parse(e.start),b=parse(e.end||e.start);if(eventPeriod==='Hoje')return a<=dayStart&&b>=dayStart;if(eventPeriod==='Semana')return b>=dayStart&&a<=weekEnd;return b>=dayStart&&a<=monthEnd}); 
 const status=document.createElement('div');status.className='eventUpdate';status.textContent=language==='pt'?(eventSource==='feed'?'● Agenda atualizada automaticamente':'● A mostrar a última agenda disponível'):(eventSource==='feed'?'● Agenda updated automatically':'● Showing the latest available agenda');cards.append(status);
 if(!list.length){const empty=document.createElement('div');empty.className='eventEmpty';empty.innerHTML=language==='pt'?'<strong>Sem eventos nesta seleção</strong>Experimenta outro período ou distrito.<div class="eventUpdate">A agenda está a ser ligada progressivamente a fontes oficiais.</div>':'<strong>No events in this selection</strong>Try another period or district.<div class="eventUpdate">The agenda is being progressively connected to official sources.</div>';cards.append(empty);return}
 list.forEach(e=>{const eventIcon={'Música':'🎵','Festas & Cultura':'🎉','Gastronomia':'🍷','Desporto':'⚽','Outros':'✨'}[e.type]||'✨';const c=document.createElement('article');c.className='discoverCard';c.innerHTML=`<div class="dcTop"><div><strong>${eventIcon} ${e.name}</strong><div style="color:#9fa8b2;font-size:12px;margin-top:3px">📍 ${e.city}</div></div><span>›</span></div><div class="dcPills"><span>${e.type}</span><span>${e.date}</span></div><p>${e.desc}</p>${e.url?`<a class="eventOfficial" href="${e.url}" target="_blank" rel="noopener noreferrer">${language==='pt'?'↗ Informação oficial':'↗ Official information'}</a>`:''}`;cards.append(c)})
}
function renderCollection(items,icon){

 cards.append(makeAreaTabs(available,()=>renderCollection(items,icon)));
 items.filter(p=>areaFilter==='Todos'||areaOf(p.city)===areaFilter).forEach(p=>{const c=document.createElement('article');c.className='discoverCard';c.innerHTML=`<div class="dcTop"><div><strong>${icon} ${p.name}</strong><div style="color:#9fa8b2;font-size:12px;margin-top:3px">📍 ${p.city}</div></div><span style="font-size:20px">›</span></div><div class="dcPills"><span>${p.type}</span><span>${p.time}</span></div><p>${p.desc}</p>`;c.onclick=()=>openCollection(p,items,icon);cards.append(c)})

function openCollection(p,items,icon){
 const cards=$('cards');cards.replaceChildren();const back=document.createElement('button');back.textContent='← '+(language==='pt'?'Voltar':'Back');back.onclick=()=>renderCollection(items,icon);cards.append(back);
 const box=document.createElement('article');box.className='card';box.style.marginTop='12px';box.innerHTML=`<h2>${icon} ${p.name}</h2><div class="dcPills"><span>📍 ${p.city}</span><span>${p.type}</span><span>${p.time}</span></div><p class="desc">${p.desc}</p>`;
 const photo=document.createElement('a');photo.className='discoverPhoto';photo.target='_blank';photo.rel='noopener noreferrer';photo.href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p.q);photo.innerHTML='<div><b>📷 Ver fotografias</b><span>Toca aqui para ver imagens online</span></div>';box.append(photo);

function areaOf(city){
 const c=(city||'').toLowerCase();
 if(/porto|gaia|avintes|miramar|valadares|candal|gondomar|valongo|maia|melres|penafiel|paço de sousa|vila do conde/.test(c)) return 'Porto';
 if(/braga|guimarães|amares|gerês/.test(c)) return 'Braga';
 if(/aveiro|ílhavo|costa nova|são jacinto|barra|arouca/.test(c)) return 'Aveiro';
 return 'Outros';
}
function makeAreaTabs(areas,onChange){
 const d=document.createElement('div');d.className='areaTabs';
 areas.forEach(a=>{const b=document.createElement('button');b.textContent=a;b.className=areaFilter===a?'active':'';b.onclick=()=>{areaFilter=a;onChange()};d.append(b)});return d
}
