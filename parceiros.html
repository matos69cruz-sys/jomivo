<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c10"><title>Parceiros locais · JOMIVO</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0c10;color:#f5f7f8;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 75px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{color:#baff38;text-decoration:none;font-weight:700}.lang{background:#1b2027;color:#fff;border:1px solid #343a43;border-radius:10px;padding:10px}.eyebrow{color:#baff38;text-transform:uppercase;letter-spacing:2px;font-size:12px;margin:36px 0 8px}h1{font-size:clamp(30px,7vw,48px);line-height:1.1;margin:0 0 10px}p{color:#aeb6c0;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0}.card{min-height:180px;background:linear-gradient(140deg,#202630,#12161c);border:1px solid #343a43;border-radius:18px;padding:17px 9px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer}.mark{height:76px;width:76px;border-radius:50%;background:#fff;color:#98204e;display:grid;place-items:center;text-align:center;font-weight:800;font-size:12px;padding:7px}.mark.c{background:#fff0e8;color:#a65367}.card strong{text-align:center;font-size:14px}.card small{color:#aeb6c0}.details[hidden],.grid[hidden],.listingIntro[hidden]{display:none}.details{background:#161a20;border:1px solid #343a43;border-radius:18px;padding:23px 18px;margin-top:20px}.details h2{text-align:center;font-size:27px}.details .mark{width:100px;height:100px;font-size:15px;margin:auto}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.links a{background:#242a32;border:1px solid #343a43;color:#fff;text-decoration:none;border-radius:12px;padding:14px 8px;text-align:center;font-weight:700}.links .wa{grid-column:1/-1;background:#baff38;border-color:#baff38;color:#101217}.note{text-align:center;font-size:13px}.return{background:none;color:#baff38;border:0;padding:10px 0;font-size:15px;font-weight:700;cursor:pointer}@media(max-width:360px){.card strong{font-size:12px}}
</style></head><body><main><div class="top"><a class="back" href="/">← JOMIVO</a><select class="lang" id="lang" aria-label="Language"><option value="pt">PT 🇵🇹</option><option value="en">EN 🇬🇧</option></select></div><div class="eyebrow" id="eyebrow">JOMIVO · COMUNIDADE</div><h1 id="title">Parceiros locais</h1><p class="listingIntro" id="intro">Descobre pequenos negócios locais que trabalham por encomenda.</p><div class="grid" id="grid"><button class="card" data-id="pudim"><span class="mark">A Casa<br>do Pudim</span><strong>A Casa do Pudim</strong><small class="order">Por encomenda →</small></button><button class="card" data-id="carrossel"><span class="mark c">Carrossel<br>Criativo</span><strong>Carrossel Criativo</strong><small class="order">Por encomenda →</small></button></div><section class="details" id="details" hidden><button class="return" id="return">← Parceiros locais</button><div class="mark" id="mark"></div><h2 id="name"></h2><p id="description"></p><nav class="links"><a class="wa" id="wa" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a><a id="instagram" target="_blank" rel="noopener noreferrer">Instagram ↗</a><a id="facebook" target="_blank" rel="noopener noreferrer">Facebook ↗</a></nav><p class="note" id="note">Apenas por encomenda · Sem loja aberta ao público</p></section></main><script>
const data={
pudim:{name:'A Casa do Pudim',mark:'A Casa<br>do Pudim',pt:'Sobremesas preparadas por encomenda. Entra em contacto para conhecer as opções disponíveis e saber mais sobre as encomendas.',en:'Desserts made to order. Get in touch to discover the available options and ask about placing an order.',ig:'https://instagram.com/a_casa_do_pudim',fb:'https://www.facebook.com/share/14zbNH3SXk2/',msg:'Olá! Encontrei a Casa do Pudim através do JOMIVO e gostaria de saber mais sobre as encomendas.'},
carrossel:{name:'Carrossel Criativo',mark:'Carrossel<br>Criativo',pt:'Produtos criativos disponíveis por encomenda. Entra em contacto para conhecer as opções e saber mais sobre este projeto local.',en:'Creative products available to order. Get in touch to explore the options and learn more about this local project.',ig:'https://instagram.com/carrossel.criativo',fb:'https://www.facebook.com/share/1BeiEBaejW/',msg:'Olá! Encontrei o Carrossel Criativo através do JOMIVO e gostaria de saber mais sobre as encomendas.'}};
let selected=null;const el=id=>document.getElementById(id);function render(){const en=el('lang').value==='en';document.documentElement.lang=en?'en':'pt';el('eyebrow').textContent=en?'JOMIVO · COMMUNITY':'JOMIVO · COMUNIDADE';el('title').textContent=en?'Local partners':'Parceiros locais';el('intro').textContent=en?'Discover independent local businesses offering made-to-order products.':'Descobre pequenos negócios locais que trabalham por encomenda.';document.querySelectorAll('.order').forEach(x=>x.textContent=en?'Made to order →':'Por encomenda →');el('return').textContent=en?'← Local partners':'← Parceiros locais';el('note').textContent=en?'Orders only · No walk-in shop':'Apenas por encomenda · Sem loja aberta ao público';if(selected){const d=data[selected];el('description').textContent=d[en?'en':'pt'];}}function show(id){selected=id;const d=data[id];el('grid').hidden=true;el('intro').hidden=true;el('details').hidden=false;el('name').textContent=d.name;el('mark').innerHTML=d.mark;el('mark').className='mark'+(id==='carrossel'?' c':'');el('instagram').href=d.ig;el('facebook').href=d.fb;el('wa').href='https://wa.me/351933322617?text='+encodeURIComponent(d.msg);render();window.scrollTo(0,0)}function back(){selected=null;el('grid').hidden=false;el('intro').hidden=false;el('details').hidden=true;window.scrollTo(0,0)}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));el('return').onclick=back;el('lang').onchange=render;render();
</script></body></html>
